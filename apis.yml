name: Barinthus Biotherapeutics
description: >-
  Barinthus Biotherapeutics plc (Nasdaq: BRNS) is a clinical-stage
  biopharmaceutical company developing novel immunotherapies designed to guide
  and reprogram T cells to overcome autoimmunity, inflammatory disease, chronic
  viral infection, and cancer. Its lead SNAP-TI and SNAP-CI antigen-specific
  platforms and ChAdOx/MVA immunotherapeutic candidates power a five-program
  pipeline including VTP-1000 (celiac disease), VTP-300 (chronic hepatitis B),
  VTP-200 (high-risk HPV), VTP-850 (recurrent prostate cancer), and VTP-1100
  (HPV-related cancer). The company was formed in 2021 through the merger of
  Oxford University spinout Vaccitech plc and NIH/Johns Hopkins spinout Avidea
  Technologies, and is headquartered in Germantown, Maryland with research
  facilities in the UK. It was surfaced as a portfolio company of Hongshan and
  added to the API Evangelist network. As a therapeutics company it publishes
  no public developer API, SDK, or agent surface.
